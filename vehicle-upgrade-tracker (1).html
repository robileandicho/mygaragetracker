<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upgrade Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--or:#ff4d12;--bg:#0a0a0a;--pn:#101010;--ln:#2a2a2a;--mu:#9a9a9a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#f2f2f2;font:14px/1.5 Barlow,'Segoe UI',Arial,sans-serif}
h1,h2,h3,.logo,.big,.btn,nav a{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 24px;background:#0a0a0af2;border-bottom:1px solid var(--ln)}
.logo{font-size:24px;letter-spacing:.5px}.logo b{color:var(--or);margin-left:6px}
#links{display:flex;gap:20px;margin:0 auto}
nav a{cursor:pointer;font-size:15px;letter-spacing:1px;padding:4px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{border-color:var(--or)}
select,input,textarea{background:#0c0c0c;border:1px solid var(--ln);color:#fff;padding:9px 10px;font:inherit;width:100%}
nav select{width:auto;max-width:200px}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.btn{background:transparent;border:1px solid #666;color:#fff;padding:9px 18px;cursor:pointer;font-size:15px;letter-spacing:1px}
.btn:hover{border-color:var(--or)}.btn.p{background:var(--or);border-color:var(--or)}.btn.p:hover{background:#ff6a35}
.btn.s{padding:5px 11px;font-size:13px}.btn.d:hover{border-color:#f44;color:#f66}
main{max-width:1240px;margin:auto;padding:0 24px 40px}
.hero{margin:0 -24px 28px;padding:60px 24px 48px;background:linear-gradient(90deg,#0a0a0a 35%,#0a0a0acc),repeating-linear-gradient(115deg,#141414 0 22px,#0d0d0d 22px 44px);background-size:cover;background-position:center;border-bottom:1px solid var(--or)}
.hero .in{max-width:1240px;margin:auto}
.hero h1{font-size:clamp(44px,8vw,92px);line-height:.92}.hero h1 span{color:var(--or);display:block}
.hero p{max-width:520px;color:#ccc;margin:16px 0 22px}
.tag{color:var(--or);font-style:italic;font-size:12px;margin-bottom:2px}
.st{display:flex;align-items:center;gap:14px;margin:30px 0 14px}.st h2{font-size:28px}.st:after{content:"";flex:1;border-top:1px solid var(--ln)}
.g{display:grid;gap:14px}.g1{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pn{background:var(--pn);border:1px solid var(--ln);padding:16px;min-width:0}
.pn h3{font-size:18px;margin-bottom:10px}
.stat{text-align:center;padding:14px 8px}.stat .big{font-size:30px;color:var(--or);line-height:1.1}.stat small{color:var(--mu);text-transform:uppercase;font-size:11px;letter-spacing:1px}
.bad{color:#ff5a5a!important}
.bar{height:8px;background:#222;margin:6px 0}.bar i{display:block;height:100%;background:var(--or)}
.card{background:var(--pn);border:1px solid var(--ln);display:flex;flex-direction:column}
.card .ph{height:160px;background:#161616 repeating-linear-gradient(115deg,#181818 0 14px,#121212 14px 28px);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px}
.card .ac{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--ln)}
.card h3{font-size:20px}.pr{color:var(--or);font-size:22px}
.bg{position:absolute;top:8px;left:8px;padding:2px 10px;font-size:12px;font-weight:600;color:#000;text-transform:uppercase}
.mu{color:var(--mu);font-size:13px}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tb input,.tb select{width:auto;flex:1;min-width:130px}
.tabs button{background:#0c0c0c;border:1px solid var(--ln);color:#ccc;padding:8px 14px;cursor:pointer}.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
svg{width:100%;height:auto;display:block}svg text{fill:#9a9a9a;font:11px Barlow,sans-serif}
.hb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;margin-right:5px}
.empty{text-align:center;padding:60px 20px;border:1px dashed #444}.empty h2{font-size:34px;margin-bottom:8px}
#m{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:30px 12px}#m.on{display:flex}
#f{background:var(--pn);border:1px solid var(--or);width:min(640px,100%);padding:20px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{font-size:28px}.mh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#f label{display:block;margin:10px 0;color:#bbb;font-size:12px;text-transform:uppercase;letter-spacing:.5px}#f label input,#f label select,#f label textarea{margin-top:4px;text-transform:none;letter-spacing:0;color:#fff;font-size:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;margin-top:4px}.seg label{flex:1;margin:0}.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:9px;border:1px solid var(--ln);cursor:pointer;color:#ccc}.seg input:checked+span{background:var(--or);border-color:var(--or);color:#fff}.seg input:focus-visible+span{outline:2px solid #fff}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--or);padding:10px 22px;display:none;z-index:30;font-weight:600}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--or);background:#181818}
footer{border-top:1px solid var(--or);padding:20px 24px;color:var(--mu);text-align:center;font-size:12px}
.ok{color:#3ddc84}.wn{color:#ffb020}
@media print{nav,footer,.btn,.tb,#toast{display:none!important}body{background:#fff;color:#000}.pn,.card,.hero{background:#fff!important;border-color:#bbb;color:#000}.hero{background-image:none!important}.hero p,.mu{color:#444}svg text{fill:#333}}
@media(max-width:620px){#links{order:3;width:100%;justify-content:space-between;margin:0}.r2{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr 80px}}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s,border-color .15s}}
</style></head><body>
<nav><div class="logo">Upgrade<b>Tracker</b></div><div id="links"></div><select id="ps" aria-label="Project"></select><button class="btn p" onclick="itemForm()">+ Add item</button></nav>
<main id="app"></main>
<footer>All prices in Philippine peso (₱). Data is saved in this browser only — use Export in Profile to back it up.</footer>
<div id="m"><form id="f"><div class="mh"><h2 id="mt"></h2><button type="button" onclick="closeM()" aria-label="Close">✕</button></div><div id="mb"></div></form></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='vut-ph-1';
const C={done:'#3ddc84',pending:'#ff4d12',wish:'#4da6ff'},L={done:'Done',pending:'Pending',wish:'Wishlist'};
const CATS=['Engine & ECU','Turbo / Intake','Exhaust','Suspension','Brakes','Wheels & Tires','Exterior / Aero','Interior','Electronics','Lighting','Audio','Maintenance','Other'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{profile:{name:'',email:'',phone:'',loc:'',bio:'',avatar:'',goal:0},projects:[],items:[],cur:'all',view:'dash'};
let F={st:'all',q:'',cat:'',sort:'new'};S.svc=S.svc||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full — remove some photos')}};
const php=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n||0);
const uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const tot=i=>(+i.price||0)*(+i.qty||1),sum=(a,s)=>a.filter(i=>!s||i.status===s).reduce((x,i)=>x+tot(i),0);
const cur=()=>S.items.filter(i=>S.cur==='all'||i.pid===S.cur);
const pname=id=>(S.projects.find(p=>p.id===id)||{name:'—'}).name;
const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':Math.round(n);
const opt=(v,s,l)=>`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(l||v)}</option>`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const img=f=>new Promise(r=>{if(!f||!f.size)return r('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r('');im.src=fr.result};fr.readAsDataURL(f)});
function modal(t,h,cb){$('#mt').textContent=t;$('#mb').innerHTML=h;$('#m').classList.add('on');$('#f').onsubmit=async e=>{e.preventDefault();await cb(new FormData(e.target))}}
const closeM=()=>$('#m').classList.remove('on');
document.addEventListener('keydown',e=>e.key==='Escape'&&closeM());
function nav(){$('#links').innerHTML=[['dash','Dashboard'],['proj','Projects'],['items','Items'],['svc','Service'],['prof','Profile']].map(([k,t])=>`<a tabindex=0 class="${S.view===k?'on':''}" onclick="go('${k}')">${t}</a>`).join('');
$('#ps').innerHTML='<option value="all">All projects</option>'+S.projects.map(p=>opt(p.id,S.cur,p.name)).join('')}
$('#ps').onchange=e=>{S.cur=e.target.value;save();render()};
const go=v=>{S.view=v;save();render();scrollTo(0,0)};
function render(){if(S.cur!=='all'&&!S.projects.some(p=>p.id===S.cur))S.cur='all';nav();$('#app').innerHTML={dash:vDash,proj:vProj,items:vItems,svc:vSvc,prof:vProf}[S.view]()}
const sec=(t,h,b)=>`<div class="st"><div><div class="tag">${t}</div><h2>${h}</h2></div></div>${b}`;
/* charts */
function months(){const o=[],n=new Date();for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);o.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return o}
function barChart(it){const ms=months(),W=560,H=230,d=ms.map(m=>{const a=it.filter(i=>(i.date||'').startsWith(m));return{m,done:sum(a,'done'),pending:sum(a,'pending'),wish:sum(a,'wish')}}),mx=Math.max(1,...d.map(x=>x.done+x.pending+x.wish));
let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spending">`;
d.forEach((x,i)=>{const X=24+i*90;let y=H-28;['done','pending','wish'].forEach(k=>{const h=x[k]/mx*(H-60);y-=h;s+=`<rect x="${X}" y="${y}" width="56" height="${h}" fill="${C[k]}"><title>${L[k]}: ${php(x[k])}</title></rect>`});
const t=x.done+x.pending+x.wish;s+=`<text x="${X+28}" y="${y-5}" text-anchor="middle">${t?'₱'+short(t):''}</text><text x="${X+28}" y="${H-10}" text-anchor="middle">${new Date(x.m+'-01').toLocaleString('en',{month:'short'})}</text>`});
return s+`</svg><div class="lg">${Object.keys(L).map(k=>`<span><i style="background:${C[k]}"></i>${L[k]}</span>`).join('')}</div>`}
function lineChart(it){const a=it.filter(i=>i.status==='done'&&i.date).sort((x,y)=>x.date<y.date?-1:1);if(!a.length)return'<p class="mu">Mark items as Done to see your spending climb over time.</p>';
let c=0;const p=a.map(i=>[+new Date(i.date),c+=tot(i),i]),t0=p[0][0],sp=Math.max(p.at(-1)[0]-t0,1),W=560,H=230,mx=c;
const xy=q=>[p.length>1?30+(q[0]-t0)/sp*500:280,200-q[1]/mx*160],pts=p.map(q=>xy(q).join(',')).join(' ');
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spend"><polygon points="30,200 ${pts} ${xy(p.at(-1))[0]},200" fill="#ff4d1226"/><polyline points="${pts}" fill="none" stroke="#ff4d12" stroke-width="2.5"/>${p.map(q=>{const[x,y]=xy(q);return`<circle cx="${x}" cy="${y}" r="4" fill="#fff"><title>${q[2].date} · ${esc(q[2].name)} · ${php(q[1])} total</title></circle>`}).join('')}<line x1="30" x2="530" y1="200" y2="200" stroke="#333"/><text x="30" y="220">${a[0].date}</text><text x="530" y="220" text-anchor="end">${a.at(-1).date}</text><text x="30" y="30">${php(mx)}</text></svg>`}
function donut(d,pe,w){const t=d+pe+w||1;let o=0,s='<svg viewBox="0 0 120 120" style="max-width:150px"><circle cx="60" cy="60" r="40" fill="none" stroke="#222" stroke-width="18"/>';[[d,C.done],[pe,C.pending],[w,C.wish]].forEach(([v,c])=>{const l=v/t*251.3;s+=`<circle cx="60" cy="60" r="40" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l});
return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${s}</svg><div>${[['done',d],['pending',pe],['wish',w]].map(([k,v])=>`<div><i style="display:inline-block;width:10px;height:10px;background:${C[k]};margin-right:6px"></i>${L[k]}: <b>${php(v)}</b> <span class="mu">(${Math.round(v/t*100)}%)</span></div>`).join('')}</div></div>`}
function catBars(it){const m={};it.forEach(i=>m[i.cat]=(m[i.cat]||0)+tot(i));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e[0]?e[0][1]:1;
return e.length?e.map(([c,v])=>`<div class="hb"><span>${esc(c)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${php(v)}</b></div>`).join(''):'<p class="mu">No items yet.</p>'}
/* views */
function vDash(){if(!S.projects.length)return`<div class="empty" style="margin-top:40px"><h2>Start your first build</h2><p class="mu" style="margin-bottom:18px">Create a project, then add parts, photos, links and prices.</p><button class="btn p" onclick="projForm()">Create project</button> <button class="btn" onclick="demo()">Load demo data</button></div>`;
const it=cur(),p=S.projects.find(x=>x.id===S.cur),d=sum(it,'done'),pe=sum(it,'pending'),w=sum(it,'wish'),bud=p?+p.budget||0:S.projects.reduce((a,x)=>a+(+x.budget||0),0),left=bud-d-pe,used=bud?Math.min(100,(d+pe)/bud*100):0;
const mk=today().slice(0,7),ms=sum(it.filter(i=>(i.date||'').startsWith(mk)),'done'),g=+S.profile.goal||0,nm=S.profile.name?esc(S.profile.name.split(' ')[0]):'Driver';
const bg=p&&p.photo?`background-image:linear-gradient(90deg,#0a0a0a 30%,#0a0a0acc),url('${esc(p.photo)}')`:'';
const top=[...it].sort((a,b)=>tot(b)-tot(a)).slice(0,5),rec=[...it].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1).slice(0,6),
nx=it.filter(i=>i.status==='wish').sort((a,b)=>['High','Medium','Low'].indexOf(a.prio)-['High','Medium','Low'].indexOf(b.prio)).slice(0,5);
return `<div class="hero" style="${bg}"><div class="in"><div class="tag">Welcome back, ${nm}</div><h1>Built for<span>the track.</span></h1><p>${p?esc(p.vehicle)+' — '+esc(p.name):'Every part, every peso, across all your builds.'}</p><button class="btn p" onclick="itemForm()">Add item</button> <button class="btn" onclick="go('items')">View items</button></div></div>
<div class="g g1"><div class="pn stat"><div class="big">${php(d)}</div><small>Spent (done)</small></div><div class="pn stat"><div class="big">${php(pe)}</div><small>Pending</small></div><div class="pn stat"><div class="big">${php(w)}</div><small>Wishlist</small></div><div class="pn stat"><div class="big ${left<0?'bad':''}">${php(left)}</div><small>Budget left</small></div><div class="pn stat"><div class="big">${it.length}</div><small>Items</small></div><div class="pn stat"><div class="big">${g?php(ms)+' / '+short(g):php(ms)}</div><small>This month${g?' vs goal':''}</small></div></div>
<div class="pn" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><span>Budget used (done + pending)</span><b>${Math.round(used)}% of ${php(bud)}</b></div><div class="bar"><i style="width:${used}%;${left<0?'background:#f44':''}"></i></div>${left<0?'<span class="bad">Over budget by '+php(-left)+'</span>':''}${g&&ms>g?'<div class="bad">Monthly goal exceeded by '+php(ms-g)+'</div>':''}</div>
${alerts(it)}${sec('Data. Analyze. Improve.','Spending telemetry',`<div class="g g2"><div class="pn"><h3>Monthly spend (last 6 months)</h3>${barChart(it)}</div><div class="pn"><h3>Cumulative spend (done)</h3>${lineChart(it)}</div><div class="pn"><h3>Status split</h3>${donut(d,pe,w)}</div><div class="pn"><h3>Spend by category</h3>${catBars(it)}</div></div>`)}
${sec('Insights','Price breakdown',`<div class="g g2"><div class="pn"><h3>Most expensive items</h3>${top.map(i=>`<div class="hb" style="grid-template-columns:1fr 100px"><span>${esc(i.name)} <span class="mu">${L[i.status]}</span></span><b>${php(tot(i))}</b></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div><div class="pn"><h3>Wishlist priorities</h3>${nx.map(i=>`<div class="hb" style="grid-template-columns:1fr 70px 100px"><span>${esc(i.name)}</span><span class="mu">${esc(i.prio)}</span><b>${php(tot(i))}</b></div>`).join('')||'<p class="mu">Wishlist is empty.</p>'}</div></div>`)}
${sec('Garage','Budget by project',`<div class="pn sc"><table><tr><th>Project</th><th>Done</th><th>Pending</th><th>Wishlist</th><th>Budget</th><th>Used</th></tr>${S.projects.map(x=>{const a=S.items.filter(i=>i.pid===x.id),u=sum(a,'done')+sum(a,'pending'),b=+x.budget||0;return`<tr><td>${esc(x.name)}</td><td>${php(sum(a,'done'))}</td><td>${php(sum(a,'pending'))}</td><td>${php(sum(a,'wish'))}</td><td>${php(b)}</td><td class="${u>b&&b?'bad':''}">${b?Math.round(u/b*100)+'%':'—'}</td></tr>`}).join('')}</table></div>`)}
${sec('Activity','Recent items',`<div class="g g3">${rec.map(card).join('')||'<p class="mu">No items yet.</p>'}</div>`)}`}
function pcard(p){const a=S.items.filter(i=>i.pid===p.id),d=sum(a,'done'),pe=sum(a,'pending'),b=+p.budget||0,n=a.filter(i=>i.status==='done').length,pct=a.length?Math.round(n/a.length*100):0;
return `<div class="card"><div class="ph">${p.photo?`<img src="${esc(p.photo)}" alt="">`:''}</div><div class="bd"><h3>${esc(p.name)}</h3><div class="mu">${esc(p.vehicle)}</div><div class="mu">${esc(p.notes)}</div><div style="margin-top:6px">${n}/${a.length} items done (${pct}%)</div><div class="bar"><i style="width:${pct}%"></i></div><div>Spent <b class="pr" style="font-size:18px">${php(d)}</b> · Pending ${php(pe)}</div><div class="mu">Budget ${php(b)} · Left <span class="${b-d-pe<0?'bad':''}">${php(b-d-pe)}</span></div></div><div class="ac"><button class="btn s p" onclick="S.cur='${p.id}';go('items')">Open</button><button class="btn s" onclick="projForm('${p.id}')">Edit</button><button class="btn s" onclick="dupProj('${p.id}')">Duplicate</button><button class="btn s d" onclick="delProj('${p.id}')">Delete</button></div></div>`}
const vProj=()=>sec('Your garage','Projects',`<div style="margin-bottom:14px"><button class="btn p" onclick="projForm()">+ New project</button></div>`)+(S.projects.length?`<div class="g g3">${S.projects.map(pcard).join('')}</div>`:`<div class="empty"><h2>No projects yet</h2><p class="mu">Each project is one vehicle or build with its own budget.</p></div>`);
function card(i){const nx={wish:'Start (pending)',pending:'Mark done',done:'Reopen'}[i.status];
return `<div class="card"><div class="ph">${i.photo?`<img src="${esc(i.photo)}" alt="" loading="lazy" onerror="this.remove()">`:''}<span class="bg" style="background:${C[i.status]}">${L[i.status]}</span></div><div class="bd"><h3>${esc(i.name)}</h3><div class="mu">${esc(i.cat)} · ${esc(pname(i.pid))}</div><div class="pr">${php(tot(i))}</div>${extra(i)}<div class="mu">${i.qty>1?i.qty+' × '+php(i.price)+' · ':''}${esc(i.date||'')} · ${esc(i.prio)} priority${i.shop?' · '+esc(i.shop):''}</div>${i.notes?`<div class="mu">${esc(i.notes)}</div>`:''}</div><div class="ac"><button class="btn s p" onclick="cycle('${i.id}')">${nx}</button><button class="btn s" onclick="itemForm('${i.id}')">Edit</button>${safe(i.link)?`<a class="btn s" style="text-decoration:none" href="${safe(i.link)}" target="_blank" rel="noopener noreferrer">Link</a>`:''}<button class="btn s" onclick="hist('${i.id}')">Prices</button><button class="btn s" onclick="dupItem('${i.id}')">Copy</button><button class="btn s d" onclick="delItem('${i.id}')">Delete</button></div></div>`}
function lst(){let a=cur().filter(i=>(F.st==='all'||i.status===F.st)&&(!F.cat||i.cat===F.cat)&&(!F.q||(i.name+i.notes+i.shop).toLowerCase().includes(F.q.toLowerCase())));
const pr=['High','Medium','Low'];a.sort({new:(x,y)=>(y.date||'')<(x.date||'')?-1:1,hi:(x,y)=>tot(y)-tot(x),lo:(x,y)=>tot(x)-tot(y),name:(x,y)=>x.name.localeCompare(y.name),prio:(x,y)=>pr.indexOf(x.prio)-pr.indexOf(y.prio)}[F.sort]);
return `<p class="mu" style="margin-bottom:10px">${a.length} item(s) · Total ${php(sum(a))}</p>`+(a.length?`<div class="g g3">${a.map(card).join('')}</div>`:`<div class="empty"><h2>Nothing here</h2><p class="mu">Add an item or change your filters.</p></div>`)}
const vItems=()=>sec(S.cur==='all'?'All projects':esc(pname(S.cur)),'Parts & upgrades',`<div class="tb"><div class="tabs">${['all','done','pending','wish'].map(s=>`<button class="${F.st===s?'on':''}" onclick="F.st='${s}';render()">${s==='all'?'All':L[s]}</button>`).join('')}</div><input placeholder="Search items…" value="${esc(F.q)}" oninput="F.q=this.value;$('#il').innerHTML=lst()"><select onchange="F.cat=this.value;render()"><option value="">All categories</option>${CATS.map(c=>opt(c,F.cat)).join('')}</select><select onchange="F.sort=this.value;render()">${[['new','Newest'],['hi','Price: high'],['lo','Price: low'],['name','Name'],['prio','Priority']].map(([v,l])=>opt(v,F.sort,l)).join('')}</select></div><div id="il">${lst()}</div>`);
function vProf(){const p=S.profile,f=(k,l,t='text')=>`<label>${l}<input name="${k}" type="${t}" value="${esc(p[k])}"></label>`;
return sec('Driver','Profile',`<div class="g g2"><form class="pn" onsubmit="saveProf(event)"><div style="display:flex;gap:16px;align-items:center;margin-bottom:10px">${p.avatar?`<img class="av" src="${esc(p.avatar)}" alt="">`:'<div class="av"></div>'}<label class="mu" style="flex:1">Profile photo<input type="file" name="file" accept="image/*"></label></div><div class="r2" style="gap:12px">${f('name','Full name')}${f('email','Email','email')}${f('phone','Phone','tel')}${f('loc','Location')}</div><label class="mu" style="display:block;margin-top:10px">Monthly spending goal (₱)<input name="goal" type="number" min="0" step="0.01" value="${+p.goal||''}"></label><label class="mu" style="display:block;margin-top:10px">About you / your builds<textarea name="bio" rows="3">${esc(p.bio)}</textarea></label><div class="fa"><button class="btn p">Save profile</button></div></form>
<div class="pn"><h3>Your data</h3><p class="mu" style="margin-bottom:12px">${S.projects.length} projects · ${S.items.length} items · ${php(sum(S.items,'done'))} spent</p><div class="tb"><button class="btn s" onclick="exp('json')">Export backup (JSON)</button><button class="btn s" onclick="exp('csv')">Export items (CSV)</button><label class="btn s">Import backup<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn s" onclick="print()">Print report</button><button class="btn s" onclick="demo()">Load demo data</button><button class="btn s d" onclick="reset()">Erase everything</button></div></div></div>`)}
function extra(i){const h=i.hist||[],o=[];
if(h.length>1){const d=h.at(-1)[1]-h.at(-2)[1];if(d)o.push(`<span class="${d>0?'bad':'ok'}">${d>0?'▲':'▼'} ${php(Math.abs(d))} since ${h.at(-2)[0]}</span>`)}
if(i.target&&i.status==='wish')o.push(i.price<=i.target?'<b class="ok">Target price reached!</b>':`<span class="mu">Target ${php(i.target)} · ${php(i.price-i.target)} to go</span>`);
if(i.warr){const d=Math.ceil((new Date(i.warr)-new Date())/864e5);o.push(`<span class="${d<0?'bad':d<60?'wn':'mu'}">Warranty ${d<0?'expired':d+' days left'}</span>`)}
return o.map(x=>`<div>${x}</div>`).join('')}
function svcDue(){const m={},od={};S.svc.forEach(s=>{const k=s.pid+s.type.toLowerCase();if(!m[k]||s.date>m[k].date)m[k]=s;od[s.pid]=Math.max(od[s.pid]||0,+s.odo||0)});
const t=today(),n=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
return Object.values(m).map(s=>({...s,late:!!((s.nextDate&&s.nextDate<t)||(+s.nextOdo&&od[s.pid]>=+s.nextOdo)),soon:!!((s.nextDate&&s.nextDate<=n)||(+s.nextOdo&&od[s.pid]>=+s.nextOdo-500))})).filter(s=>s.late||s.soon)}
function alerts(it){const a=[];
it.forEach(i=>{if(i.warr){const d=Math.ceil((new Date(i.warr)-new Date())/864e5);if(d<=60)a.push([d<0?'bad':'wn',`Warranty ${d<0?'expired':'ends in '+d+' days'}: ${esc(i.name)}`])}if(i.status==='wish'&&i.target&&i.price<=i.target)a.push(['ok',`Target price hit: ${esc(i.name)} (${php(i.price)})`])});
svcDue().filter(s=>S.cur==='all'||s.pid===S.cur).forEach(s=>a.push([s.late?'bad':'wn',`Service ${s.late?'overdue':'due soon'}: ${esc(s.type)} — ${esc(pname(s.pid))}`]));
return a.length?`<div class="pn" style="margin-top:14px"><h3>Reminders</h3>${a.map(([c,x])=>`<div class="${c}">• ${x}</div>`).join('')}</div>`:''}
function vSvc(){const a=S.svc.filter(s=>S.cur==='all'||s.pid===S.cur).sort((x,y)=>y.date<x.date?-1:1),od=Math.max(0,...a.map(s=>+s.odo||0));
return sec('Maintenance','Service log',`<div style="margin-bottom:14px"><button class="btn p" onclick="svcForm()">+ Log service</button></div><div class="g g1" style="margin-bottom:14px"><div class="pn stat"><div class="big">${php(a.reduce((x,s)=>x+(+s.cost||0),0))}</div><small>Service spend</small></div><div class="pn stat"><div class="big">${a.length}</div><small>Records</small></div><div class="pn stat"><div class="big">${od.toLocaleString()} km</div><small>Latest odometer</small></div></div>`+(a.length?`<div class="pn sc"><table><tr><th>Date</th><th>Project</th><th>Service</th><th>Odometer</th><th>Cost</th><th>Next due</th><th></th></tr>${a.map(s=>`<tr><td>${s.date}</td><td>${esc(pname(s.pid))}</td><td>${esc(s.type)}<div class="mu">${esc(s.notes)}</div></td><td>${(+s.odo||0).toLocaleString()} km</td><td>${php(s.cost)}</td><td>${[s.nextDate,+s.nextOdo?(+s.nextOdo).toLocaleString()+' km':''].filter(Boolean).join(' / ')||'—'}</td><td><button class="btn s" onclick="svcForm('${s.id}')">Edit</button> <button class="btn s d" onclick="svcDel('${s.id}')">Delete</button></td></tr>`).join('')}</table></div>`:`<div class="empty"><h2>No service records</h2><p class="mu">Log oil changes, alignments and installs to get due-date reminders.</p></div>`))}
function svcForm(id){if(!S.projects.length){toast('Create a project first');return projForm()}
const s=S.svc.find(x=>x.id===id)||{pid:S.cur!=='all'?S.cur:S.projects[0].id,date:today()};
modal(id?'Edit service':'Log service',`<div class="r2"><label>Project<select name="pid">${S.projects.map(p=>opt(p.id,s.pid,p.name)).join('')}</select></label><label>Service*<input name="type" list="stl" required value="${esc(s.type)}"></label></div><datalist id="stl">${['Oil change','Brake service','Wheel alignment','Tire rotation','Coolant flush','Dyno session','Inspection','Detailing'].map(x=>`<option>${x}</option>`).join('')}</datalist><div class="r2"><label>Date<input name="date" type="date" value="${s.date}"></label><label>Odometer (km)<input name="odo" type="number" min="0" value="${s.odo||''}"></label></div><div class="r2"><label>Cost (₱)<input name="cost" type="number" min="0" step="0.01" value="${s.cost||''}"></label><label>Shop<input name="shop" value="${esc(s.shop)}"></label></div><div class="r2"><label>Next due date<input name="nextDate" type="date" value="${s.nextDate||''}"></label><label>Next due odometer (km)<input name="nextOdo" type="number" min="0" value="${s.nextOdo||''}"></label></div><label>Notes<textarea name="notes" rows="2">${esc(s.notes)}</textarea></label><div class="fa"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn p">Save service</button></div>`,
fd=>{const r={...s,...Object.fromEntries(fd),id:id||uid()};S.svc=id?S.svc.map(x=>x.id===id?r:x):[...S.svc,r];save();closeM();render();toast('Service saved')})}
function svcDel(id){if(confirm('Delete this service record?')){S.svc=S.svc.filter(x=>x.id!==id);save();render()}}
function hist(id){const i=S.items.find(x=>x.id===id),h=i.hist&&i.hist.length?i.hist:[[i.date||today(),i.price]];
modal('Price history',`<p class="mu">${esc(i.name)}</p><div class="sc"><table><tr><th>Date</th><th>Price each</th><th>Change</th></tr>${h.map((x,k)=>`<tr><td>${x[0]}</td><td>${php(x[1])}</td><td>${k?php(x[1]-h[k-1][1]):'—'}</td></tr>`).join('')}</table></div><label>Log a new price check (₱)<input name="np" type="number" min="0" step="0.01" required></label><div class="fa"><button type="button" class="btn" onclick="closeM()">Close</button><button class="btn p">Log price</button></div>`,
fd=>{const v=+fd.get('np')||0;i.hist=[...h,[today(),v]];i.price=v;save();closeM();render();toast('Price logged')})}
function dupItem(id){const i=S.items.find(x=>x.id===id);S.items.push({...i,id:uid(),name:i.name+' (copy)',status:'wish',hist:[[today(),i.price]]});save();render();toast('Copied to wishlist')}
/* actions */
async function saveProf(e){e.preventDefault();const fd=new FormData(e.target),o=Object.fromEntries(fd),a=await img(o.file);delete o.file;S.profile={...S.profile,...o,goal:+o.goal||0,avatar:a||S.profile.avatar};save();render();toast('Profile saved')}
function projForm(id){const p=S.projects.find(x=>x.id===id)||{};
modal(id?'Edit project':'New project',`<label>Project name*<input name="name" required value="${esc(p.name)}" placeholder="e.g. Track build"></label><div class="r2"><label>Vehicle<input name="vehicle" value="${esc(p.vehicle)}" placeholder="2022 Toyota GR86"></label><label>Budget (₱)<input name="budget" type="number" min="0" step="0.01" value="${p.budget||''}"></label></div><label>Cover photo URL<input name="photo" type="url" value="${p.photo&&!p.photo.startsWith('data:')?esc(p.photo):''}"></label><label>…or upload<input type="file" name="file" accept="image/*"></label><label>Notes<textarea name="notes" rows="2">${esc(p.notes)}</textarea></label><div class="fa"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn p">Save project</button></div>`,
async fd=>{const o=Object.fromEntries(fd),ph=await img(o.file)||o.photo||(p.photo||'');delete o.file;const r={...p,...o,photo:ph,budget:+o.budget||0,id:id||uid()};S.projects=id?S.projects.map(x=>x.id===id?r:x):[...S.projects,r];if(!id)S.cur=r.id;save();closeM();render();toast('Project saved')})}
function itemForm(id){if(!S.projects.length){toast('Create a project first');return projForm()}
const i=S.items.find(x=>x.id===id)||{pid:S.cur!=='all'?S.cur:S.projects[0].id,cat:CATS[0],status:'pending',qty:1,date:today(),prio:'Medium'};
modal(id?'Edit item':'Add item',`<label>Item name*<input name="name" required value="${esc(i.name)}"></label><div class="r2"><label>Project<select name="pid">${S.projects.map(p=>opt(p.id,i.pid,p.name)).join('')}</select></label><label>Category<select name="cat">${CATS.map(c=>opt(c,i.cat)).join('')}</select></label></div><label>Status<div class="seg">${['done','pending','wish'].map(s=>`<label><input type="radio" name="status" value="${s}" ${i.status===s?'checked':''}><span>${L[s]}</span></label>`).join('')}</div></label><div class="r2"><label>Price each (₱)<input name="price" type="number" min="0" step="0.01" required value="${i.price??''}"></label><label>Quantity<input name="qty" type="number" min="1" value="${i.qty}"></label></div><div class="r2"><label>Date<input name="date" type="date" value="${i.date||today()}"></label><label>Priority<select name="prio">${['High','Medium','Low'].map(x=>opt(x,i.prio)).join('')}</select></label></div><div class="r2"><label>Target price (₱) — wishlist alert<input name="target" type="number" min="0" step="0.01" value="${i.target||''}"></label><label>Warranty until<input name="warr" type="date" value="${i.warr||''}"></label></div><label>Shop / seller<input name="shop" value="${esc(i.shop)}"></label><label>Product link<input name="link" type="url" placeholder="https://" value="${esc(i.link)}"></label><label>Photo URL<input name="photo" type="url" value="${i.photo&&!i.photo.startsWith('data:')?esc(i.photo):''}"></label><label>…or upload photo<input type="file" name="file" accept="image/*"></label><label>Notes<textarea name="notes" rows="2">${esc(i.notes)}</textarea></label><div class="fa"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn p">Save item</button></div>`,
async fd=>{const o=Object.fromEntries(fd),ph=await img(o.file)||o.photo||(i.photo&&i.photo.startsWith('data:')?i.photo:'');delete o.file;const pr=+o.price||0,h=[...(i.hist||[])];if(!h.length||h.at(-1)[1]!==pr)h.push([today(),pr]);const r={...i,...o,photo:ph,price:pr,qty:+o.qty||1,hist:h,target:+o.target||0,id:id||uid()};S.items=id?S.items.map(x=>x.id===id?r:x):[...S.items,r];save();closeM();render();toast('Item saved')})}
function cycle(id){const i=S.items.find(x=>x.id===id);i.status={wish:'pending',pending:'done',done:'pending'}[i.status];if(i.status==='done')i.date=today();save();render();toast('Marked '+L[i.status].toLowerCase())}
function delItem(id){if(confirm('Delete this item?')){S.items=S.items.filter(x=>x.id!==id);save();render()}}
function delProj(id){if(confirm('Delete this project and all its items?')){S.projects=S.projects.filter(x=>x.id!==id);S.items=S.items.filter(x=>x.pid!==id);S.svc=S.svc.filter(x=>x.pid!==id);save();render()}}
function dupProj(id){const p=S.projects.find(x=>x.id===id),n=uid();S.projects.push({...p,id:n,name:p.name+' (copy)'});S.items.filter(i=>i.pid===id).forEach(i=>S.items.push({...i,id:uid(),pid:n,status:'wish'}));save();render();toast('Duplicated — items copied to wishlist')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(k){if(k==='json')return dl('upgrade-tracker-backup.json',JSON.stringify(S),'application/json');
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl('upgrade-items.csv',['Project,Item,Category,Status,Qty,Price PHP,Total PHP,Date,Priority,Shop,Link'].concat(S.items.map(i=>[pname(i.pid),i.name,i.cat,L[i.status],i.qty,i.price,tot(i),i.date,i.prio,i.shop,i.link].map(q).join(','))).join('\n'),'text/csv')}
async function imp(f){try{const d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.items))throw 0;S={...S,...d,view:'prof'};S.svc=S.svc||[];save();render();toast('Backup imported')}catch(e){toast('Not a valid backup file')}}
function reset(){if(confirm('Erase all projects, items and profile data?')){S={profile:{name:'',email:'',phone:'',loc:'',bio:'',avatar:'',goal:0},projects:[],items:[],svc:[],cur:'all',view:'dash'};save();render()}}
function demo(){const m=n=>{const d=new Date();d.setDate(10);d.setMonth(d.getMonth()-n);return d.toISOString().slice(0,10)},a=uid(),b=uid();
S.projects.push({id:a,name:'Track Build',vehicle:'2023 Honda Civic Type R',budget:450000,photo:'',notes:'Weekend track car'},{id:b,name:'Daily Driver',vehicle:'2021 Toyota Fortuner',budget:120000,photo:'',notes:'Comfort & lighting'});
[[a,'Stage 1 ECU tune','Engine & ECU','done',45000,1,5,'High','Dyno Shop MNL'],[a,'Cat-back exhaust','Exhaust','done',68000,1,4,'Medium','Akrapovic PH'],[a,'Coilover kit','Suspension','done',95000,1,3,'High','Tein PH'],[a,'Brake pads & fluid','Brakes','done',14500,1,2,'High','Lazada'],[a,'Forged wheels 19"','Wheels & Tires','pending',160000,1,0,'Medium','Rays PH'],[a,'Semi-slick tires','Wheels & Tires','pending',9500,4,0,'Medium','Shopee'],[a,'Front lip splitter','Exterior / Aero','wish',22000,1,0,'Low',''],[a,'Bucket seats','Interior','wish',48000,2,0,'Low',''],[b,'LED headlight bulbs','Lighting','done',6800,1,2,'Medium','Shopee'],[b,'Dash cam (front+rear)','Electronics','done',7200,1,1,'Low','Lazada'],[b,'All-terrain tires','Wheels & Tires','pending',52000,1,0,'High',''],[b,'Roof rack','Exterior / Aero','wish',18500,1,0,'Low','']].forEach(([pid,name,cat,status,price,qty,mo,prio,shop])=>S.items.push({id:uid(),pid,name,cat,status,price,qty,date:m(mo),prio,shop,link:'',photo:'',notes:''}));
S.svc.push({id:uid(),pid:a,type:'Oil change',date:m(2),odo:21500,cost:3800,nextDate:m(0),nextOdo:26500,shop:'Honda Cars',notes:'0W-30 synthetic'},{id:uid(),pid:a,type:'Wheel alignment',date:m(1),odo:23400,cost:2500,nextDate:'',nextOdo:'',shop:'',notes:'After coilovers'});
const c=S.items.find(i=>i.name==='Coilover kit');c.warr=new Date(Date.now()+20*864e5).toISOString().slice(0,10);const w=S.items.find(i=>i.name==='Front lip splitter');w.target=25000;w.hist=[[m(2),26500],[m(0),22000]];w.price=22000;
S.view='dash';save();render();toast('Demo data loaded')}
render();
</script></body></html>
