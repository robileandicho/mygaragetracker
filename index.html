<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Garage Tracker – Vehicle Upgrade Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d9d8;--shell:#f2f2f1;--card:#fff;--soft:#e8e8e6;--ink:#0b0b0b;--on-ink:#fff;--mut:#7f7f7b;--line:#dcdcd9;--lime:#d7fb3c;--blk:#0b0b0b;--ring:#0b0b0b;--c-done:#d7fb3c;--c-pending:#ffc247;--c-wishlist:#b4c3d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090a;--shell:#151618;--card:#1e1f22;--soft:#27282c;--ink:#f4f4f2;--on-ink:#0b0b0b;--mut:#92939a;--line:#2e2f34;--blk:#000;--ring:#d7fb3c}}
:root[data-theme="dark"]{--bg:#09090a;--shell:#151618;--card:#1e1f22;--soft:#27282c;--ink:#f4f4f2;--on-ink:#0b0b0b;--mut:#92939a;--line:#2e2f34;--blk:#000;--ring:#d7fb3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h2{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:12px}
.wrap{max-width:1280px;margin:0 auto;padding:16px 14px}
.shell{background:var(--shell);border:8px solid var(--card);border-radius:40px;padding:18px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.tabs{display:flex;gap:2px;background:var(--card);padding:5px;border-radius:999px;overflow-x:auto}
.tab{border:0;background:none;font-weight:700;padding:9px 16px;border-radius:999px;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.tab small{opacity:.55;margin-left:6px;font-weight:700}
.right{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pill{background:var(--card);border:0;border-radius:999px;padding:10px 14px;display:flex;gap:8px;align-items:center;font-weight:700;height:42px}
select.pill{padding-right:8px;appearance:auto}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.btn{background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;padding:0 20px;height:42px;font-weight:800;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.lime{background:var(--lime);color:#0b0b0b}.btn.ghost{background:var(--soft);color:var(--ink)}
:is(button,input,select,a,.pick):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:26px}
.card{background:var(--card);border-radius:28px;padding:20px}
.hero{grid-column:span 8;background:var(--soft);display:grid;grid-template-columns:1.05fr .95fr;gap:18px;min-height:360px}
.hl{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{align-self:flex-start;background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.vname{background:transparent;border:0;padding:0;margin-top:6px;width:100%;font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.05;letter-spacing:-.02em}
.big{font-weight:800;font-size:clamp(34px,5.2vw,58px);letter-spacing:-.035em;line-height:1.05;overflow-wrap:anywhere}
.chips{display:grid;gap:8px;margin-top:auto;padding-top:12px}
.chip{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--card) 72%,transparent);border-radius:18px;padding:9px 12px}
.chip b{font-size:15px}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:#0b0b0b}
.car{position:relative;border-radius:22px;background:var(--card);overflow:hidden;min-height:220px;display:grid;place-items:center;color:var(--mut);text-align:center}
.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.car .btn{position:absolute;left:12px;bottom:12px;height:36px;padding:0 14px;font-size:12.5px}
.prog{grid-column:span 4}
.ringbox{position:relative;width:150px;height:150px;margin:2px auto 16px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:13}
.trk{stroke:var(--soft)}.arc{stroke:var(--ring);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}.rc span{font-size:12px;color:var(--mut)}
.seg{display:flex;gap:3px;height:10px;margin-bottom:14px}.seg i{border-radius:99px;min-width:0;transition:width .5s}
.row{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row i{width:10px;height:10px;border-radius:50%}.row em{font-style:normal;color:var(--mut);font-size:12px}.row b{min-width:40px;text-align:right}
.cat{grid-column:span 7}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:6px 0}
.bt{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.bt div{height:100%;border-radius:99px;background:var(--ring);transition:width .5s}
.blk{grid-column:span 5;background:var(--blk);color:#fff;border:1px solid var(--line)}
.blk .mut{color:#a3a3a0}
.bigl{font-weight:800;font-size:clamp(30px,4vw,46px);letter-spacing:-.03em;color:var(--lime);line-height:1.1;overflow-wrap:anywhere}
.lr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #2a2a2a}
.next{display:flex;gap:14px;align-items:center;background:#1b1b1b;border-radius:20px;padding:12px;margin-top:14px}
.date{width:58px;height:58px;border-radius:16px;background:var(--lime);color:#0b0b0b;display:grid;place-content:center;text-align:center;font-weight:800;font-size:22px;line-height:1;flex:none}
.date small{font-size:10px;font-weight:700;margin-top:3px}
.next div:last-child{min-width:0}.next b,.next span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}.sec h2{margin:0;font-size:20px}
.sec-controls{display:flex;gap:8px;align-items:center}
.view-toggle{display:flex;background:var(--card);border-radius:99px;padding:3px;border:1px solid var(--line)}
.view-toggle button{border:0;background:none;padding:6px 12px;border-radius:99px;font-weight:700;font-size:12px;color:var(--mut)}
.view-toggle button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}

/* Grid View / Card View */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.part{padding:12px;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;border-radius:20px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;color:#0b0b0b}
.acts{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.acts button{height:32px;min-width:32px;padding:0 9px;border:0;border-radius:99px;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800}
.acts button.arm{background:#ff5a4d;color:#fff}
.pm{display:flex;justify-content:space-between;gap:10px;margin:12px 4px 10px}
.pm h3{margin:0;font-size:16px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.pm .mut{font-size:12.5px}
.price{font-weight:800;font-size:18px;white-space:nowrap}
.pf{display:grid;gap:8px;margin-top:auto}
.st{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:99px;padding:3px}
.st button{border:0;background:none;color:var(--mut);font-weight:800;font-size:12px;padding:7px 4px;border-radius:99px}
.st button[aria-pressed=true]{color:#0b0b0b}
.st .done[aria-pressed=true]{background:var(--c-done)}.st .pending[aria-pressed=true]{background:var(--c-pending)}.st .wishlist[aria-pressed=true]{background:var(--c-wishlist)}
.go{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:var(--on-ink);text-decoration:none;border-radius:99px;padding:5px 5px 5px 14px;font-weight:700;font-size:12.5px}
.go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go i{width:26px;height:26px;border-radius:50%;background:var(--lime);color:#0b0b0b;display:grid;place-items:center;flex:none}

/* List View Style */
.list-view{display:flex;flex-direction:column;gap:8px}
.list-view .part{display:grid;grid-template-columns:48px 2fr 1fr 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-radius:18px}
.list-view .ph{width:48px;height:48px;border-radius:12px;aspect-ratio:auto}
.list-view .ph img{width:100%;height:100%}
.list-view .badge{position:static;padding:3px 8px;font-size:11px;display:inline-block;width:fit-content}
.list-view .acts{position:static;display:flex;gap:4px}
.list-view .pm{margin:0;display:contents}
.list-view .pf{display:contents}
.list-view .st{display:flex;gap:4px;background:none;padding:0}
.list-view .st button{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px}
.list-view .go{display:none}

.empty{grid-column:1/-1;text-align:center;padding:44px 20px;background:var(--card);border-radius:28px}
.empty p{margin:0 0 14px;color:var(--mut)}
dialog{border:0;border-radius:28px;padding:0;background:var(--card);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,10,10,.55);backdrop-filter:blur(4px)}
.dg{padding:22px;display:grid;gap:14px}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h2{margin:0;font-size:20px}
label,.lbl{display:grid;gap:6px;font-weight:700;font-size:12.5px}
input:not(.vname),select:not(.pill){background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:2px dashed var(--line);background:var(--soft);border-radius:18px;height:160px;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;color:var(--mut);text-align:center}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{border:2px solid var(--line);background:none;border-radius:14px;padding:10px 4px;font-weight:800}
.opts button[aria-pressed=true]{border-color:var(--ink);background:var(--soft)}
.opts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.err{color:#e5483b;font-weight:700;min-height:0}
.dfoot{display:flex;justify-content:space-between;align-items:center}
.backup-btns{display:flex;gap:6px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){.hero,.prog,.cat,.blk{grid-column:1/-1}.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;order:3}}
@media (max-width:620px){.shell{border-width:5px;border-radius:30px;padding:12px}.hero{grid-template-columns:1fr}.brand b{display:none}.bar{grid-template-columns:90px 1fr auto}.pill.tot .mut{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="shell">
<header class="top">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/><path d="M4 5l7 7-7 7" opacity=".5"/></svg></div><b>My Garage Tracker</b></div>
  <nav class="tabs" id="tabs" aria-label="Filter parts">
    <button class="tab" data-f="all">All<small></small></button>
    <button class="tab" data-f="done">Done<small></small></button>
    <button class="tab" data-f="pending">Pending<small></small></button>
    <button class="tab" data-f="wishlist">Wishlist<small></small></button>
  </nav>
  <div class="right">
    <div class="pill tot"><span class="mut">Total</span><b id="htot">0</b></div>
    <select class="pill" id="cur" aria-label="Currency"><option>₱</option><option>$</option><option>€</option><option>£</option><option>¥</option></select>
    <button class="icon" id="theme" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
    <button class="btn" id="add">+ Add part</button>
  </div>
</header>

<section class="dash" aria-label="Dashboard">
  <div class="card hero">
    <div class="hl">
      <span class="tag">Total upgrade cost</span>
      <input class="vname" id="vname" maxlength="40" aria-label="Vehicle name" placeholder="Name your vehicle">
      <div class="big" id="tot">0</div>
      <div class="mut sm" id="sub"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="car" id="car"></div>
  </div>
  <div class="card prog">
    <h2>Build progress</h2>
    <div class="ringbox"><svg viewBox="0 0 140 140" aria-hidden="true"><circle class="trk" cx="70" cy="70" r="58"/><circle class="arc" id="arc" cx="70" cy="70" r="58" stroke-dasharray="364.4" stroke-dashoffset="364.4"/></svg><div class="rc"><b id="pct">0%</b><span>of cost installed</span></div></div>
    <div class="seg" id="seg"></div>
    <div id="rows"></div>
  </div>
  <div class="card cat"><h2>Spend by category</h2><div id="cats"></div></div>
  <div class="card blk">
    <h2>Still to spend</h2>
    <div class="bigl" id="left">0</div>
    <div class="mut sm" style="margin-bottom:10px">Pending plus wishlist</div>
    <div id="lrows"></div>
    <div class="next"><div class="date" id="nleft">0<small>left</small></div><div><b id="nx">Nothing queued</b><span class="mut sm" id="nxs">Add a pending part</span></div></div>
    <div class="backup-btns">
      <button class="btn ghost sm" id="exportBtn" style="flex:1;height:34px">Export Backup</button>
      <button class="btn ghost sm" id="importBtn" style="flex:1;height:34px">Import JSON</button>
    </div>
  </div>
</section>

<section>
  <div class="sec">
    <h2>Upgrades</h2>
    <div class="sec-controls">
      <span class="mut" id="cnt"></span>
      <div class="view-toggle" id="viewToggle">
        <button data-view="grid" aria-pressed="true">Cards</button>
        <button data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>
</div></div>

<dialog id="dlg">
  <div class="dg">
    <div class="dh"><h2 id="dt">Add part</h2><button class="icon" id="x" aria-label="Close" style="background:var(--soft)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pick" id="pick" role="button" tabindex="0" aria-label="Add or change part photo"></div>
    <label>Product name<input id="fn" maxlength="80" placeholder="e.g. Coilover suspension kit"></label>
    <div class="two">
      <label>Price<input id="fp" inputmode="decimal" placeholder="0"></label>
      <label>Category<select id="fc"></select></label>
    </div>
    <div class="two">
      <label>Est. Labor Cost<input id="flabor" inputmode="decimal" placeholder="0"></label>
      <label>Shop / Vendor<input id="fvendor" maxlength="40" placeholder="e.g. Lazada / SpeedLab"></label>
    </div>
    <label>Product link<input id="fl" inputmode="url" placeholder="https://shop.com/product"></label>
    <div class="lbl">Status<div class="opts" id="fs"></div></div>
    <div class="err" id="err" role="alert"></div>
    <div class="dfoot"><button class="btn ghost" id="cancel">Cancel</button><button class="btn lime" id="save">Save part</button></div>
  </div>
</dialog>
<input type="file" id="pfile" accept="image/*" hidden>
<input type="file" id="vfile" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json" hidden>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=[['done','Done'],['pending','Pending'],['wishlist','Wishlist']];
const L={done:'Done',pending:'Pending',wishlist:'Wishlist'};
const CATS=['Engine','Wheels & Tires','Suspension','Brakes','Exterior','Interior','Electronics','Other'];
const KEY='mygaragetracker.v1';
const I=(d,w)=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
const P={check:'M5 12.5l4.5 4.5L19 7.5',clock:'M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',arrow:'M7 17L17 7M8 7h9v9',edit:'M4 20h4L19 9l-4-4L4 16v4z',trash:'M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',box:'M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z'};
let S={vehicle:'',cur:'₱',photo:'',theme:'',view:'grid',parts:[]},filter='all',editId=null,draft={},armed=null,at,tt,st;
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.parts))S=Object.assign(S,r)}catch(e){}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){
    toast('Warning: LocalStorage is full. Try uploading smaller vehicle/part photos.');
  }
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3800)}
const money=n=>S.cur+(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
function shrink(file,max,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('That file could not be read as an image.');im.src=fr.result};fr.readAsDataURL(file)}
function calc(){
  const t={done:0,pending:0,wishlist:0},c={done:0,pending:0,wishlist:0};
  S.parts.forEach(p=>{
    const itemTotal = (+p.price||0) + (+p.labor||0);
    t[p.status] += itemTotal;
    c[p.status]++;
  });
  const total=t.done+t.pending+t.wishlist,n=S.parts.length;
  const pct=total>0?Math.round(t.done/total*100):(n?Math.round(c.done/n*100):0);
  return{t,c,total,n,pct}
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'Open link'}}

function render(){
  const {t,c,total,n,pct}=calc(),left=t.pending+t.wishlist;
  $('#tot').textContent=$('#htot').textContent=money(total);
  $('#sub').textContent=n?c.done+' of '+n+' part'+(n==1?'':'s')+' installed':'No parts added yet';
  document.querySelectorAll('.tab').forEach(b=>{const f=b.dataset.f;b.setAttribute('aria-pressed',f===filter);b.querySelector('small').textContent=f==='all'?n:c[f]});
  const ic=[P.check,P.clock,P.star];
  $('#chips').innerHTML=ST.map(([k,l],i)=>'<div class="chip"><span class="ico" style="background:var(--c-'+k+')">'+I(ic[i])+'</span><div><div class="mut sm">'+l+' · '+c[k]+' part'+(c[k]==1?'':'s')+'</div><b>'+money(t[k])+'</b></div></div>').join('');
  $('#car').innerHTML=(S.photo?'<img alt="Vehicle photo" src="'+S.photo+'">':'<div><svg width="120" height="56" viewBox="0 0 120 50" fill="currentColor"><path d="M8 34c0-5 3-7 8-8l14-9c3-2 7-3 11-3h30c5 0 9 2 12 5l8 6c9 1 15 3 15 9v3h-8H8z"/><circle cx="35" cy="38" r="7" fill="var(--soft)" stroke="currentColor" stroke-width="4"/><circle cx="87" cy="38" r="7" fill="var(--soft)" stroke="currentColor" stroke-width="4"/></svg><div class="sm" style="margin-top:6px">Add a photo of your ride</div></div>')+'<button class="btn" data-a="vp">'+I(P.cam)+(S.photo?'Change photo':'Add photo')+'</button>';
  $('#arc').style.strokeDashoffset=364.4*(1-pct/100);$('#pct').textContent=pct+'%';
  $('#seg').innerHTML=total>0?ST.map(([k])=>t[k]>0?'<i style="width:'+(t[k]/total*100)+'%;background:var(--c-'+k+')"></i>':'').join(''):'<i style="width:100%;background:var(--soft)"></i>';
  $('#rows').innerHTML=ST.map(([k,l])=>'<div class="row"><i style="background:var(--c-'+k+')"></i><span>'+l+'</span><em>'+c[k]+' · '+money(t[k])+'</em><b>'+(total?Math.round(t[k]/total*100):0)+'%</b></div>').join('');
  const cs={};S.parts.forEach(p=>{cs[p.cat]=(cs[p.cat]||0)+(+p.price||0)+(+p.labor||0)});
  const arr=Object.entries(cs).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=arr.length?Math.max(arr[0][1],1):1;
  $('#cats').innerHTML=arr.length?arr.map(([k,v])=>'<div class="bar"><span>'+esc(k)+'</span><div class="bt"><div style="width:'+Math.max(v/mx*100,3)+'%"></div></div><b>'+money(v)+'</b></div>').join(''):'<p class="mut" style="margin:0">Add a part to see where your money goes.</p>';
  $('#left').textContent=money(left);
  $('#lrows').innerHTML='<div class="lr"><span class="mut">Pending</span><b>'+money(t.pending)+'</b></div><div class="lr"><span class="mut">Wishlist</span><b>'+money(t.wishlist)+'</b></div>';
  const todo=S.parts.filter(p=>p.status!=='done'),nx=todo.filter(p=>p.status==='pending').sort((a,b)=>(b.price+b.labor)-(a.price+a.labor))[0]||todo[0];
  $('#nleft').innerHTML=todo.length+'<small>left</small>';
  $('#nx').textContent=nx?nx.name:'Nothing queued';
  $('#nxs').textContent=nx?L[nx.status]+' · '+money((+nx.price||0)+(+nx.labor||0)):'Add a pending part';
  const list=filter==='all'?S.parts:S.parts.filter(p=>p.status===filter);
  $('#cnt').textContent=list.length+' item'+(list.length==1?'':'s');
  
  // Render based on selected view mode
  const gridEl = $('#grid');
  gridEl.className = S.view === 'list' ? 'list-view' : 'grid';
  document.querySelectorAll('#viewToggle button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view === S.view));

  gridEl.innerHTML=list.length?list.map(partHTML).join(''):'<div class="empty"><p>'+(n?'No '+L[filter].toLowerCase()+' parts yet.':'Your upgrade list is empty. Add your first part to start tracking your build.')+'</p><button class="btn" data-a="add">+ Add part</button></div>';
}

function partHTML(p){
  const subTotal = (+p.price||0) + (+p.labor||0);
  if(S.view === 'list'){
    return '<article class="card part" data-id="'+p.id+'">'+
    '<div class="ph">'+(p.photo?'<img alt="'+esc(p.name)+'" src="'+p.photo+'">':I(P.box,1.5))+'</div>'+
    '<div><h3>'+esc(p.name)+'</h3><div class="mut">'+esc(p.cat)+(p.vendor?' · '+esc(p.vendor):'')+'</div></div>'+
    '<div><span class="badge" style="background:var(--c-'+p.status+')">'+L[p.status]+'</span></div>'+
    '<div class="price">'+money(subTotal)+(p.labor>0?' <small class="mut">(incl. labor)</small>':'')+'</div>'+
    '<div class="acts"><button data-a="edit" aria-label="Edit '+esc(p.name)+'">'+I(P.edit)+'</button><button data-a="del" class="'+(armed===p.id?'arm':'')+'" aria-label="Delete '+esc(p.name)+'">'+(armed===p.id?'Delete?':I(P.trash))+'</button></div>'+
    '</article>';
  }
  return '<article class="card part" data-id="'+p.id+'"><div class="ph">'+(p.photo?'<img alt="'+esc(p.name)+'" src="'+p.photo+'">':I(P.box,1.5).replace('width="18" height="18"','width="44" height="44"'))+
  '<span class="badge" style="background:var(--c-'+p.status+')">'+L[p.status]+'</span><div class="acts"><button data-a="edit" aria-label="Edit '+esc(p.name)+'">'+I(P.edit)+'</button><button data-a="del" class="'+(armed===p.id?'arm':'')+'" aria-label="Delete '+esc(p.name)+'">'+(armed===p.id?'Delete?':I(P.trash))+'</button></div></div>'+
  '<div class="pm"><div><h3>'+esc(p.name)+'</h3><div class="mut">'+esc(p.cat)+(p.vendor?' · '+esc(p.vendor):'')+'</div></div><div class="price">'+money(subTotal)+'</div></div>'+
  '<div class="pf"><div class="st">'+ST.map(([k,l])=>'<button class="'+k+'" data-a="st" data-s="'+k+'" aria-pressed="'+(p.status===k)+'">'+l+'</button>').join('')+'</div>'+
  (p.link?'<a class="go" href="'+esc(p.link)+'" target="_blank" rel="noopener noreferrer"><span>'+esc(host(p.link))+'</span><i>'+I(P.arrow)+'</i></a>':'')+'</div></article>';
}

/* dialog */
const dlg=$('#dlg');
function pickUI(){$('#pick').innerHTML=draft.photo?'<img alt="Part photo preview" src="'+draft.photo+'">':'<div>'+I(P.cam)+'<div class="sm" style="margin-top:4px">Tap to add a photo</div></div>'}
function optsUI(){$('#fs').innerHTML=ST.map(([k,l])=>'<button type="button" data-s="'+k+'" aria-pressed="'+(draft.status===k)+'"><i style="background:var(--c-'+k+')"></i>'+l+'</button>').join('')}
function openDlg(p){
  editId=p?p.id:null;draft=p?{photo:p.photo||'',status:p.status}:{photo:'',status:ST.some(s=>s[0]===filter)?filter:'wishlist'};
  $('#dt').textContent=p?'Edit part':'Add part';
  $('#fn').value=p?p.name:'';$('#fp').value=p&&p.price?p.price:'';$('#flabor').value=p&&p.labor?p.labor:'';$('#fvendor').value=p&&p.vendor?p.vendor:'';$('#fl').value=p?p.link||'':'';$('#fc').value=p?p.cat:CATS[0];$('#err').textContent='';
  pickUI();optsUI();dlg.showModal();$('#fn').focus();
}
function commit(){
  const name=$('#fn').value.trim();let link=$('#fl').value.trim();
  const price=Math.max(0,Number(String($('#fp').value).replace(/[^0-9.]/g,''))||0);
  const labor=Math.max(0,Number(String($('#flabor').value).replace(/[^0-9.]/g,''))||0);
  const vendor=$('#fvendor').value.trim();
  if(!name){$('#err').textContent='Enter a product name.';$('#fn').focus();return}
  if(link){if(!/^https?:\/\//i.test(link))link='https://'+link;try{const u=new URL(link);if(!/^https?:$/.test(u.protocol))throw 0}catch(e){$('#err').textContent='Enter a valid product link.';$('#fl').focus();return}}
  const rec={name,price,labor,vendor,link,cat:$('#fc').value,status:draft.status,photo:draft.photo};
  if(editId){Object.assign(S.parts.find(x=>x.id===editId),rec)}else{S.parts.unshift(Object.assign({id:uid()},rec))}
  save();dlg.close();render();toast(editId?'Part updated':'Part added');
}
$('#fc').innerHTML=CATS.map(c=>'<option>'+esc(c)+'</option>').join('');
$('#add').onclick=()=>openDlg();
$('#x').onclick=$('#cancel').onclick=()=>dlg.close();
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
$('#save').onclick=commit;
dlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'){e.preventDefault();commit()}});
$('#fs').onclick=e=>{const b=e.target.closest('[data-s]');if(b){draft.status=b.dataset.s;optsUI()}};
$('#pick').onclick=()=>$('#pfile').click();
$('#pick').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#pfile').click()}};
$('#pfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,640,d=>{draft.photo=d;pickUI()})};
$('#vfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)shrink(f,900,d=>{S.photo=d;save();render()})};
$('#car').onclick=e=>{if(e.target.closest('[data-a=vp]'))$('#vfile').click()};

/* View toggle */
$('#viewToggle').onclick=e=>{
  const b=e.target.closest('button');
  if(b){S.view=b.dataset.view;save();render()}
};

/* Export / Import feature */
$('#exportBtn').onclick=()=>{
  const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));
  const dlAnchor=$('<a');
  dlAnchor.setAttribute('href',dataStr);
  dlAnchor.setAttribute('download','my-garage-tracker-backup.json');
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  toast('Backup exported successfully');
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const reader=new FileReader();
  reader.onload=event=>{
    try{
      const parsed=JSON.parse(event.target.result);
      if(parsed&&Array.isArray(parsed.parts)){
        S=Object.assign(S,parsed);
        save();render();
        toast('Garage backup imported successfully!');
      }else{toast('Invalid backup file structure.')}
    }catch(err){toast('Could not parse JSON file.')}
  };
  reader.readAsText(f);
};

/* page events */
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){filter=b.dataset.f;render()}};
$('#grid').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='add')return openDlg();
  const id=b.closest('[data-id]').dataset.id,p=S.parts.find(x=>x.id===id);if(!p)return;
  if(b.dataset.a==='edit')openDlg(p);
  if(b.dataset.a==='st'){p.status=b.dataset.s;save();render()}
  if(b.dataset.a==='del'){
    if(armed===id){S.parts=S.parts.filter(x=>x.id!==id);armed=null;save();render();toast('Part deleted')}
    else{armed=id;render();clearTimeout(at);at=setTimeout(()=>{armed=null;render()},3000)}
  }
};
$('#vname').value=S.vehicle;
$('#vname').oninput=e=>{S.vehicle=e.target.value;clearTimeout(st);st=setTimeout(save,300)};
$('#cur').value=S.cur;
$('#cur').onchange=e=>{S.cur=e.target.value;save();render()};
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme}
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme;const dark=d?d==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';applyTheme();save()};
applyTheme();render();
</script>
</body>
</html>
